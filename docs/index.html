<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa Co-op — Tarefas Arcade</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>html,body{margin:0;height:100%;background:#0d0b1e;color:#c9c3ff;font:16px monospace;display:grid;place-items:center}</style>
</head>
<body>
<p id="m">CARREGANDO…</p>
<script>
/* Casa Co-op — © 2026 Kevin Paulo (@Arkev.arq) · Licença MIT
   Porta de entrada: descobre qual versão do jogo está liberada para todos e abre ela.
   A versão liberada fica no Firebase (release/current), e só o administrador muda, na central.
   Se o Firebase não responder, usa a última versão que funcionou neste aparelho. */
(async()=>{
 const PROJECT='casa-co-op',KEY='AIzaSyCbh0w46HwqkXSZlyHpfZAV6Yei4c5DyKE';
 let ver=null,def=1;
 try{const v=await (await fetch('versions.json?t='+Date.now(),{cache:'no-store'})).json();def=+v.default||1}catch(e){}
 try{
  const ctl=new AbortController();setTimeout(()=>ctl.abort(),4000);
  const r=await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/release/current?key=${KEY}`,{signal:ctl.signal,cache:'no-store'});
  if(r.ok){const d=await r.json();const n=d.fields&&d.fields.stable&&(+d.fields.stable.integerValue||+d.fields.stable.doubleValue);if(n>0)ver=n}
  else if(r.status===404)ver=def;
 }catch(e){}
 if(!ver){try{ver=+localStorage.getItem('cc-ver')||null}catch(e){}}
 if(!ver)ver=def;
 try{localStorage.setItem('cc-ver',String(ver))}catch(e){}
 location.replace('v/'+ver+'/'+location.search+location.hash);
})();
</script>
</body>
</html>
