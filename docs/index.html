<!DOCTYPE html>
<!-- Casa Co-op — Tarefas Arcade · © 2026 Kevin Paulo (@Arkev.arq) · Licença MIT (veja LICENSE) -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Co-op — Tarefas Arcade</title>
<meta name="theme-color" content="#0d0b1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa Co-op">
<script>window.FBReady=new Promise(r=>{window.__fbResolve=r});</script>
<script type="module" src="backend.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Luckiest+Guy&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b1e;--panel:#1a1636;--line:#3b3470;--p1:#3ec5ff;--p2:#ff5fa2;--gold:#ffd23f;--green:#4dff88;--red:#ff4d4d;--orange:#ff9f1c;--txt:#f4f1ff;--dim:#9c95c9;--ink:#2a1d12}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'VT323',monospace;font-size:20px}
body{min-height:100vh;padding:12px 10px 60px;background:radial-gradient(ellipse at 50% -10%,#3a1f6b 0%,transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px),var(--bg)}
.crt{position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);animation:crtup 1.2s linear infinite}
@keyframes crtup{to{background-position:0 -3px}}
@media (prefers-reduced-motion:reduce){.crt{animation:none}}
.wrap{max-width:900px;margin:0 auto}
.px{font-family:'Press Start 2P',monospace}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-family:'Press Start 2P';font-size:18px;color:var(--gold);text-shadow:2px 2px 0 #c2410c,4px 4px 0 #000}
.logo span{color:var(--p1);text-shadow:2px 2px 0 #1e3a8a,4px 4px 0 #000}
.me{font-family:'Press Start 2P';font-size:8px;color:var(--dim);text-align:right;line-height:1.6}
.me button{font:inherit;background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline}
.status-line{font-size:16px;color:var(--dim);text-align:center;min-height:18px;margin-bottom:4px}

/* ---------- Corrida de foguetes ---------- */
.race{background:linear-gradient(#090720,#151036);border:4px solid #000;outline:3px solid var(--line);border-radius:6px;padding:10px 10px 6px;position:relative;overflow:hidden;margin-bottom:12px}
.race::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#9cf 1px,transparent 1.5px);background-size:47px 31px,83px 57px;background-position:0 0,20px 13px;opacity:.35;animation:stars 6s linear infinite}
@keyframes stars{to{background-position:-47px 0,-63px 13px}}
.race h3{position:relative;font-family:'Press Start 2P';font-size:9px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:6px}
.lane{position:relative;height:74px;border-bottom:2px dashed rgba(255,255,255,.12)}
.lane:last-of-type{border-bottom:0}
.finish{position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,#fff 0 8px,#000 8px 16px);opacity:.5}
.trail{position:absolute;left:0;top:50%;height:22px;transform:translateY(-30%);border-radius:0 20px 20px 0;transition:width 1.2s cubic-bezier(.2,.8,.3,1),background .8s,box-shadow .8s;animation:flick .12s steps(2) infinite alternate}
@keyframes flick{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.rider{position:absolute;top:2px;transition:left 1.2s cubic-bezier(.2,.8,.3,1);width:96px;height:70px;margin-left:-30px}
.rider svg{position:absolute;left:0;bottom:2px;width:96px;height:44px;animation:bob 1s ease-in-out infinite}
.rider img{position:absolute;left:30px;bottom:30px;width:36px;height:36px;border:3px solid #000;border-radius:50%;background:#2b2560;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.lane .tag{position:absolute;left:4px;top:2px;font-family:'Press Start 2P';font-size:8px;z-index:2;text-shadow:1px 1px 0 #000}
.lane .xpv{position:absolute;right:16px;top:4px;font-family:'Press Start 2P';font-size:10px;color:var(--gold);z-index:2;text-shadow:2px 2px 0 #000}
.legend{position:relative;display:flex;gap:4px;align-items:center;justify-content:center;font-size:14px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:8px;border:1px solid #000}

/* ---------- Tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.tab{font-family:'Press Start 2P';font-size:8px;padding:11px 4px;background:var(--panel);color:var(--dim);border:3px solid var(--line);cursor:pointer;box-shadow:0 4px 0 #000;line-height:1.4}
.tab.on{background:var(--gold);color:#000;border-color:#000}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.hint{font-size:18px;color:var(--dim);margin-bottom:10px}
.sec{font-family:'Press Start 2P';font-size:9px;color:var(--dim);margin:16px 0 8px}

/* ---------- Cartas (estilo Canva) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.card{position:relative;background:var(--c);border:3px solid #111;border-radius:12px;padding:8px 6px 6px;cursor:pointer;
  box-shadow:0 5px 0 #000;display:flex;flex-direction:column;align-items:center;min-height:168px;transition:transform .08s;color:#111}
.card:hover{transform:translateY(-3px) rotate(-1deg)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.card .t{font-family:'Luckiest Guy',cursive;font-size:17px;line-height:1;text-align:center;color:#fff;text-transform:uppercase;
  -webkit-text-stroke:5px #111;paint-order:stroke fill;letter-spacing:.5px;min-height:36px;display:flex;align-items:center}
.card .ic{width:72px;height:72px;margin:4px 0 auto}
.card .ft{align-self:stretch;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.star{width:26px;height:26px}
.card .xp{font-family:'Luckiest Guy';font-size:18px;color:#111}
.prov{position:absolute;right:-8px;top:-10px;background:#000;border:2px solid var(--gold);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px}
.card.custom{--c:#2b2560;border-style:dashed;border-color:var(--gold);color:var(--gold)}
.card.custom .t{-webkit-text-stroke:0;color:var(--gold);font-size:15px}
.card.custom .plus{font-family:'Press Start 2P';font-size:34px;margin:auto}

/* ---------- Linhas de tarefa ---------- */
.row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--c);border:3px solid #111;border-radius:12px;
  padding:8px;margin-bottom:10px;box-shadow:0 5px 0 #000;color:#111;position:relative}
.row .ic{width:56px;height:56px;background:rgba(255,255,255,.55);border:2px solid #111;border-radius:10px;padding:3px}
.row .t{font-family:'Luckiest Guy';font-size:19px;line-height:1.05;color:#fff;-webkit-text-stroke:5px #111;paint-order:stroke fill;text-transform:uppercase}
.row .m{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:17px}
.row .m .star{width:20px;height:20px}
.row .m b{font-family:'Luckiest Guy';font-size:17px;font-weight:normal}
.row.doing{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.row.done{filter:saturate(.3) brightness(.75)}
.row.done .t{text-decoration:line-through;text-decoration-thickness:3px}
.row.flash{animation:fl .45s steps(2) 3}
@keyframes fl{50%{filter:brightness(1.7)}}
.stamp{position:absolute;right:8px;top:-10px;font-family:'Press Start 2P';font-size:7px;padding:4px 6px;background:#000;border-radius:3px}
.row.todo .stamp{color:#ff8a8a}.row.doing .stamp{color:var(--orange)}.row.done .stamp{color:var(--green)}
.btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sb{font-family:'Press Start 2P';font-size:9px;width:38px;height:38px;border:3px solid #000;border-radius:6px;cursor:pointer;background:#fff;color:#555;box-shadow:0 3px 0 #000}
.sb:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.sb.todo.on{background:var(--red);color:#fff}.sb.doing.on{background:var(--orange);color:#000}.sb.done.on{background:var(--green);color:#000}
.sb.del{background:transparent;border-color:transparent;box-shadow:none;color:#111;font-size:14px;width:28px}
.who{position:absolute;left:44px;top:44px;width:28px;height:28px;border:2px solid #000;border-radius:50%}
.empty{font-size:18px;color:var(--dim);padding:2px 0 6px}


/* ---------- Brilho de tela emissiva nas cartas ---------- */
.card::before,.row::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,rgba(255,255,255,.10) 1px 2px,transparent 2px 4px);
  animation:scanmove 1.6s linear infinite,scanflick 3.2s ease-in-out infinite;mix-blend-mode:overlay}
.card::after,.row::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.22) 50%,transparent 100%) 0 -140%/100% 45% no-repeat;
  animation:scanroll 7s linear infinite;mix-blend-mode:soft-light}
.grid .card:nth-child(3n+1)::after,.row:nth-child(3n+1)::after{animation-delay:-2.3s}
.grid .card:nth-child(3n+2)::after,.row:nth-child(3n+2)::after{animation-delay:-4.6s}
.grid .card:nth-child(2n)::before{animation-delay:-.8s,-1.6s}
.card.custom::before,.card.custom::after{display:none}
@keyframes scanmove{to{background-position:0 -4px}}
@keyframes scanflick{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes scanroll{0%{background-position:0 240%}60%,100%{background-position:0 -140%}}
@media (prefers-reduced-motion:reduce){.card::before,.row::before,.card::after,.row::after{animation:none}}
.sug-new{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sug-new textarea{width:100%;min-height:80px;font-family:'VT323';font-size:20px;background:#000;color:#fff;border:3px solid var(--line);padding:8px}
.sug{position:relative;background:var(--panel);border:3px solid #000;outline:2px solid var(--line);padding:10px;margin-bottom:10px;box-shadow:0 4px 0 #000}
.sug-h{display:flex;align-items:center;gap:8px;font-family:'Press Start 2P';font-size:8px}
.sug-h img{width:26px;height:26px;border:2px solid #000;border-radius:50%}
.sug-h span{margin-left:auto;color:var(--dim);font-family:'VT323';font-size:16px}
.sug p{font-size:20px;margin:6px 0;white-space:pre-wrap}
.sug .note{font-size:16px;color:var(--dim)}
.sug .btns{justify-content:flex-start;gap:8px}
.sug .sb.del{position:absolute;right:6px;bottom:6px;color:#fff}
@media(max-width:560px){.tab{font-size:7px;padding:10px 2px}}
.box.wide{max-width:560px;text-align:left}
.lfil{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.chip.on{background:var(--gold);color:#000;border-color:#000}
.lbox{max-height:60vh;overflow:auto;background:#000;border:3px solid var(--line);padding:8px}
.lday{font-family:'Press Start 2P';font-size:8px;color:var(--gold);margin:10px 0 4px;padding-bottom:4px;border-bottom:1px dashed #333}
.lrow{display:flex;gap:6px;align-items:flex-start;font-size:17px;padding:3px 0;line-height:1.1}
.lrow img{width:22px;height:22px;border:2px solid #000;border-radius:50%;flex:none}
.lrow .lt{color:var(--dim);flex:none;width:54px}.lrow .lic{flex:none;width:22px;text-align:center}
.lrow .lx b{font-weight:normal;color:#fff;text-decoration:underline;text-decoration-color:#555}
.gate{position:fixed;inset:0;z-index:55;background:radial-gradient(ellipse at 50% 0%,#3a1f6b,transparent 70%),var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gbox{max-width:400px;width:100%;text-align:center}
.gbox h2{font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin-bottom:10px}
.gbox input,.box input#sLink{width:100%;font-family:'VT323';font-size:22px;background:#000;color:#fff;border:2px solid var(--line);padding:8px;margin-top:8px}
.cpick{display:flex;gap:8px;justify-content:center;margin:8px 0}
.cpick button{width:32px;height:32px;border:3px solid #000;border-radius:6px;cursor:pointer;box-shadow:0 3px 0 #000}
.cpick button.on{outline:3px solid #fff;transform:translateY(-2px)}
/* ---------- Placar ---------- */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--panel);border:4px solid var(--pc);padding:12px;text-align:center;box-shadow:0 5px 0 #000}
.pcard img{width:80px;height:80px;border:3px solid #000;border-radius:8px}
.pcard .nm{font-family:'Press Start 2P';font-size:11px;color:var(--pc);margin:8px 0}
.pcard .big{font-family:'Press Start 2P';font-size:20px;color:var(--gold)}
.pcard .st{display:flex;justify-content:center;gap:10px;margin-top:8px;font-size:17px}
.log{background:#000;border:3px solid var(--line);padding:10px;margin-top:12px}
.mlog{max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mlog .md{color:var(--dim);flex:none;white-space:nowrap;font-size:16px;min-width:88px}
.log div{display:flex;justify-content:space-between;gap:8px;font-size:18px;padding:3px 0;border-bottom:1px dashed #222}
.btn{font-family:'Press Start 2P';font-size:9px;padding:11px 12px;background:var(--gold);color:#000;border:3px solid #000;cursor:pointer;box-shadow:0 4px 0 #000}
.btn.ghost{background:transparent;color:var(--dim);border-color:var(--line)}
.btn.k{background:var(--p1)}.btn.j{background:var(--p2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(5,3,15,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--panel);border:4px solid var(--gold);padding:16px;max-width:380px;width:100%;box-shadow:0 8px 0 #000;text-align:center}
.box h2{font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin-bottom:12px;line-height:1.5}
.box .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.box input,.box select{width:100%;font-family:'VT323';font-size:22px;background:#000;color:#fff;border:2px solid var(--line);padding:8px;margin-top:8px}
.pick{display:flex;gap:12px;justify-content:center;margin-top:6px}
.pick button{background:var(--panel);border:4px solid var(--pc);padding:10px;cursor:pointer;box-shadow:0 5px 0 #000;color:var(--pc);font-family:'Press Start 2P';font-size:10px}
.pick button img{display:block;width:88px;height:88px;border:3px solid #000;border-radius:8px;margin-bottom:8px}
.pick button:disabled{opacity:.3;cursor:not-allowed}

/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.coin{position:absolute;width:14px;height:14px;background:var(--gold);border:2px solid #8a5a00;border-radius:50%}
.spark{position:absolute;width:8px;height:8px}
.fpts{position:absolute;font-family:'Press Start 2P';font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.banner{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:46;pointer-events:none}
.banner div{display:inline-block;font-family:'Press Start 2P';font-size:24px;padding:16px 20px;background:#000;border:4px solid var(--gold);color:var(--gold);text-shadow:3px 3px 0 #c2410c;animation:bin 1.9s steps(12) forwards}
.banner small{display:block;font-size:10px;color:#fff;margin-top:10px;text-shadow:none}
@keyframes bin{0%{transform:scale(0) rotate(-8deg)}15%{transform:scale(1.2) rotate(2deg)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:47;background:#000;border:3px solid var(--pc,var(--gold));padding:10px 14px;font-family:'Press Start 2P';font-size:9px;color:#fff;display:flex;gap:10px;align-items:center;animation:tin 3.2s forwards;max-width:92vw}
.toast img{width:34px;height:34px;border:2px solid #000;border-radius:50%}
@keyframes tin{0%{transform:translate(-50%,120px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,120px)}}
.shake{animation:shk .4s steps(8)}
@keyframes shk{25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:16px;color:var(--dim)}
.chip{font-family:'Press Start 2P';font-size:8px;padding:7px 9px;border:2px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
@media(max-width:560px){.logo{font-size:13px}.grid{grid-template-columns:repeat(3,1fr);gap:8px}.card{min-height:150px;padding:6px 3px}.card .t{font-size:13px;-webkit-text-stroke:4px #111;min-height:30px}.card .ic{width:56px;height:56px}.card .xp{font-size:14px}.star{width:20px;height:20px}.row .t{font-size:16px}.banner div{font-size:15px}}
</style>
</head>
<body>
<div class="crt"></div><div id="fx"></div>
<div class="wrap" id="app">
  <header>
    <div class="logo" id="logo"></div>
    <div style="display:flex;gap:8px;align-items:center"><button class="chip" id="logBtn" title="Registro de ações">📜 LOG</button><div class="me" id="meBox"></div></div>
  </header>
  <div class="status-line" id="statusLine">Conectando…</div>

  <section class="race" id="race">
    <h3><span>🚀 CORRIDA DO XP</span><span>FINISH ▸</span></h3>
    <div class="lane" id="lane-p1"><div class="finish"></div><span class="tag" style="color:var(--p1)" data-n="p1"></span><span class="xpv" id="xpv-p1">0 XP</span><div class="trail" id="tr-p1"></div><div class="rider" id="rd-p1"></div></div>
    <div class="lane" id="lane-p2"><div class="finish"></div><span class="tag" style="color:var(--p2)" data-n="p2"></span><span class="xpv" id="xpv-p2">0 XP</span><div class="trail" id="tr-p2"></div><div class="rider" id="rd-p2"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <nav class="tabs">
    <button class="tab on" data-tab="catalogo">≡ CARTAS</button>
    <button class="tab" data-tab="p1" data-n="p1"></button>
    <button class="tab" data-tab="p2" data-n="p2"></button>
    <button class="tab" data-tab="placar">★ PLACAR</button>
    <button class="tab" data-tab="ideias">💡 IDEIAS</button>
  </nav>

  <main id="view"></main>

  <div class="foot"><span><span id="modeNote"></span><br><small style="font-size:14px;opacity:.75">© 2026 Kevin Paulo · <a href="https://www.instagram.com/arkev.arq/" target="_blank" rel="noopener" style="color:var(--gold)">@Arkev.arq</a> · licença MIT</small></span><button class="chip" id="soundBtn">♪ SOM: ON</button></div>
</div>
<div class="gate" id="gate" hidden></div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
/* ================= DADOS FIXOS ================= */
/* ================= JOGADORES (vêm do banco, por casa) ================= */
let CONFIG={appName:"Casa Co-op",p1:{name:"Jogador 1",color:"#3ec5ff",face:""},p2:{name:"Jogador 2",color:"#ff5fa2",face:""}};
function avatar(p){                               // avatar pixelado com a inicial, quando não há retrato
 const c=p.color||'#888',L=(p.name||'?').trim().charAt(0).toUpperCase();
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="#2b2560"/><rect x="2" y="2" width="12" height="12" fill="${c}"/><rect x="2" y="12" width="12" height="2" fill="#000" opacity=".25"/><text x="8" y="11.5" font-family="monospace" font-weight="900" font-size="9" text-anchor="middle" fill="#fff" stroke="#000" stroke-width=".6" paint-order="stroke">${L.replace(/[<&"]/g,'')}</text></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
let FACE,NAME,PCOL;
function setPlayers(){
 FACE={p1:CONFIG.p1.face||avatar(CONFIG.p1),p2:CONFIG.p2.face||avatar(CONFIG.p2)};
 NAME={p1:CONFIG.p1.name||'Jogador 1',p2:CONFIG.p2.name||'Jogador 2'};
 PCOL={p1:CONFIG.p1.color||'#3ec5ff',p2:CONFIG.p2.color||'#ff5fa2'};
 document.querySelectorAll('.rider').forEach(r=>{delete r.dataset.built});
}
setPlayers();
const CATALOG=[
 {k:'cama',n:'Arrumar a cama',xp:5,c:'#c7dcff'},
 {k:'plantas',n:'Regar as plantas',xp:10,c:'#c7dcff'},
 {k:'guardar',n:'Guardar as roupas',xp:10,c:'#c7dcff'},

const svgCache={};
const OK_EL=new Set(['g','path','rect','circle','ellipse','line','polyline','polygon']);
const OK_AT=new Set(['d','x','y','width','height','rx','ry','cx','cy','r','x1','y1','x2','y2','points','fill','stroke','stroke-width','stroke-linejoin','stroke-linecap','transform','opacity','fill-opacity','stroke-opacity']);
function cleanSVG(body){                       // só formas simples: nada de script, link, imagem ou url()
 try{
  if(typeof body!=='string'||body.length>12000)return '';
  const doc=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${body}</svg>`,'image/svg+xml');
  if(doc.querySelector('parsererror'))return '';
  const out=[];
  const walk=(el,depth)=>{for(const ch of el.children){
   const tag=ch.tagName.toLowerCase();if(!OK_EL.has(tag)||depth>6)continue;
   const at=[];for(const a of ch.attributes){const n=a.name.toLowerCase(),v=a.value;
    if(!OK_AT.has(n))continue;if(/url\(|javascript|expression|[<>"]/i.test(v)||v.length>2000)continue;at.push(`${n}="${v}"`)}
   if(tag==='g'){out.push(`<g ${at.join(' ')}>`);walk(ch,depth+1);out.push('</g>')}else out.push(`<${tag} ${at.join(' ')}/>`);
  }};
  walk(doc.documentElement,0);return out.join('');
 }catch(e){return ''}
}

 return I.estrela;
}

let ac,master;
function audio(){
 if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
  master=ac.createGain();master.gain.value=0.5;master.connect(comp).connect(ac.destination);}
 if(ac.state!=='running')ac.resume();
 return ac;
}
let lastVoices=[];
function beep(seq,{cut=false}={}){
 if(!sound)return;
 try{const a=audio();
  if(cut){lastVoices.forEach(v=>{try{v.stop()}catch(e){}});lastVoices=[]}
  let t=a.currentTime+0.03;                       // agenda um pouco à frente: volume sempre igual
  seq.forEach(([f,d])=>{d=Math.max(d,0.07);
   const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.setValueAtTime(f,t);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+0.005);   // ataque fixo
   g.gain.setValueAtTime(0.12,t+d*0.6);g.gain.linearRampToValueAtTime(0,t+d);  // soltura fixa
   o.connect(g).connect(master);o.start(t);o.stop(t+d+0.02);lastVoices.push(o);
   o.onended=()=>{lastVoices=lastVoices.filter(x=>x!==o)};t+=d*0.85});
 }catch(e){}
}

/* ================= FX ================= */
function burst(x,y,color,txt){
 for(let i=0;i<18;i++){const el=document.createElement('div');el.className=i%3?'spark':'coin';if(i%3)el.style.background=[color,'#ffd23f','#fff','#4dff88'][i%4];
  el.style.left=x+'px';el.style.top=y+'px';$('fx').appendChild(el);const a=Math.random()*Math.PI*2,d=60+Math.random()*120;
  el.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px)`,opacity:0}],{duration:700+Math.random()*500,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>el.remove()}
 const f=document.createElement('div');f.className='fpts';f.style.left=(x-24)+'px';f.style.top=(y-20)+'px';f.textContent=txt;$('fx').appendChild(f);setTimeout(()=>f.remove(),1300);
}
function banner(t,s){const b=document.createElement('div');b.className='banner';b.innerHTML=`<div>${t}<small>${s||''}</small></div>`;document.body.appendChild(b);setTimeout(()=>b.remove(),1950)}
function toast(w,txt){const t=document.createElement('div');t.className='toast';t.style.setProperty('--pc',PCOL[w]);t.innerHTML=`<img src="${FACE[w]}" alt=""><span>${txt}</span>`;document.body.appendChild(t);setTimeout(()=>t.remove(),3300)}

function renderRace(){
 const k=xpOf('p1'),j=xpOf('p2'),ref=Math.max(k,j,100);
 [['p1',k],['p2',j]].forEach(([w,xp])=>{
  const pct=6+80*(xp/ref);                // posição: quem tem mais XP vai mais à frente
  const [,col]=tierOf(xp);
  const lvl=Math.min(1,xp/600);            // intensidade do brilho
  const tr=$('tr-'+w);
  tr.style.width=`calc(${pct}% - 18px)`;
  tr.style.height=(14+lvl*16)+'px';
  tr.style.background=`linear-gradient(90deg,transparent 0%,${col}55 25%,${col} 75%,#fff ${92-lvl*10}%)`;
  tr.style.boxShadow=`0 0 ${6+lvl*30}px ${2+lvl*10}px ${col}${Math.round(90+lvl*150).toString(16).padStart(2,'0')}`;
  const rd=$('rd-'+w);rd.style.left=pct+'%';
  if(!rd.dataset.built){rd.innerHTML=ROCKET(PCOL[w])+`<img src="${FACE[w]}" alt="${NAME[w]}">`;rd.dataset.built=1}
  $('xpv-'+w).textContent=xp+' XP';
 });

/* ================= AÇÕES (banco compartilhado) ================= */
const now=()=>Date.now();
async function write(id,data){
 if(local){tasks[id]=data;saveLocal();render();return}
 tasks[id]=data;render();                              // resposta imediata
 try{await db.collection('tasks').doc(id).set(data);$('statusLine').textContent='● Salvo e sincronizado';saveMirror()}catch(e){fail(e)}
}
function addTask(c,w,ev){
 const id='t'+now().toString(36)+Math.random().toString(36).slice(2,6);
 write(id,{id,cardId:c.id||null,k:c.k,name:c.n,xp:c.xp,owner:w,status:'todo',createdAt:now(),updatedAt:now(),by:me||''});
 logEvent('task_new',{taskId:id,name:c.n,owner:w,xp:c.xp});
 beep(SFX.add);
 const r=ev&&ev.target.getBoundingClientRect();if(r)burst(r.left+r.width/2,r.top,PCOL[w],'→ '+(w==='p1'?'1P':'2P'));
}
function setStatus(id,s,ev){
 const t=tasks[id];if(!t||t.status===s)return;
 const before=tierOf(xpOf(t.owner));
 prevStatus[id]=s;
 const extra=s==='doing'?{startedAt:now()}:s==='done'?{doneAt:now()}:{};
 write(id,{...t,...extra,status:s,updatedAt:now()});
 logEvent('task_'+s,{taskId:id,name:t.name,owner:t.owner,xp:txp(t)});
 const r=ev.target.getBoundingClientRect();
 if(s==='done'){
  beep(SFX.done);shake();burst(r.left+r.width/2,r.top,PCOL[t.owner],'+'+txp(t)+'XP');
  const after=tierOf(xpOf(t.owner));
  if(after[0]>before[0])setTimeout(()=>banner('TURBO!','RASTRO '+after[2].toUpperCase()),400);
  else banner('MISSÃO CUMPRIDA!',`${NAME[t.owner].toUpperCase()} +${txp(t)} XP`);
  setTimeout(()=>{const el=$('r-'+id);if(el)el.classList.add('flash')},30);
 }else beep(s==='doing'?SFX.doing:SFX.todo);
}
async function saveCard(n,xp,k,idea){

 const id='c-'+slug;
 const card={name:n,xp,icon:k,color:XPCOL(xp),order:now()};extraCards[id]=card;
 render();
 logEvent('card_new',{name:n,xp,cardId:id});
 if(local)return;
 try{await db.collection('cards').doc(id).set(card)}catch(e){fail(e)}

async function removeTask(id){
 if(tasks[id])logEvent('task_del',{taskId:id,name:tasks[id].name,owner:tasks[id].owner});
 delete tasks[id];delete prevStatus[id];render();
 if(local){saveLocal();return}

 logEvent('reset',{n:Object.keys(tasks).length});
 try{localStorage.removeItem('casacoop-mirror')}catch(e){}
 const ids=Object.keys(tasks);tasks={};prevStatus={};render();
 if(local){saveLocal();return}
 for(const id of ids){try{await db.collection('tasks').doc(id).delete()}catch(e){fail(e);break}}

/* ===== cópia automática em segundo plano (neste aparelho) ===== */
let mirrorTimer;
function saveMirror(){clearTimeout(mirrorTimer);mirrorTimer=setTimeout(()=>{try{localStorage.setItem('casacoop-mirror',backupJSON())}catch(e){}},800)}
function offerMirror(){
 let m;try{m=JSON.parse(localStorage.getItem('casacoop-mirror'))}catch(e){}
 if(!m||!Array.isArray(m.tasks)||!m.tasks.length)return;
 modal(`<h2>CONTINUE?</h2><p class="hint">O placar está vazio, mas este aparelho tem uma cópia automática com ${m.tasks.length} tarefas (${new Date(m.exportedAt).toLocaleString('pt-BR')}). Restaurar?</p>
  <div class="acts"><button class="btn" id="mY">RESTAURAR</button><button class="btn ghost" id="mN">COMEÇAR DO ZERO</button></div>`);
 $('mY').onclick=async()=>{closeModal();for(const t of m.tasks){tasks[t.id]=t;prevStatus[t.id]=t.status;try{await db.collection('tasks').doc(t.id).set(t)}catch(e){fail(e);break}}render();banner('CONTINUE!','PROGRESSO RESTAURADO')};
 $('mN').onclick=()=>{try{localStorage.removeItem('casacoop-mirror')}catch(e){}closeModal()};
}

/* ================= SUGESTÕES ================= */
async function sendSuggestion(){
 const t=$('sugTxt').value.trim();if(!t){$('sugTxt').focus();return}
 const id='s'+now().toString(36)+Math.random().toString(36).slice(2,5);
 const x={text:t.slice(0,600),by:me||'',createdAt:now()};
 suggestions[id]=x;render();
 logEvent('sug_new',{sugId:id,text:x.text.slice(0,140)});beep(SFX.add);banner('IDEIA ENVIADA!',me==='p1'?'AGORA É SÓ APROVAR':'AGUARDANDO '+NAME.p1.toUpperCase());
 if(!local){try{await db.collection('suggestions').doc(id).set(x)}catch(e){fail(e)}}
}
async function setApproval(id,status){
 if(!iAmOwner)return;
 if(status==='approved')banner('APROVADA!','VAI PRA LISTA DE MELHORIAS');
 const prev=approvals[id]||{};const a={...prev,status,at:now()};
 approvals[id]=a;render();
 logEvent('sug_'+status,{sugId:id,text:String((suggestions[id]||{}).text||'').slice(0,140)});beep(status==='approved'?SFX.done:SFX.todo);

 if(!local){try{await db.collection('approvals').doc(id).set(a)}catch(e){fail(e)}}
}

async function delSuggestion(id){
 delete suggestions[id];render();
 if(!local){try{await db.collection('suggestions').doc(id).delete()}catch(e){fail(e)}}
}

/* ================= LOG DE AÇÕES ================= */
async function logEvent(type,data){
 const id='e'+now().toString(36)+Math.random().toString(36).slice(2,6);
 const e={type,by:me||'',at:now(),...data};events[id]=e;
 if(!$('modal').hidden&&$('logList'))drawLog();
 if(local){try{localStorage.setItem('casacoop-events',JSON.stringify(events))}catch(x){}return}
 try{await db.collection('events').doc(id).set(e)}catch(x){}
}
function allEvents(){
 const out=Object.entries(events).map(([id,e])=>({id,...e}));
 // reconstrói o passado (antes do log existir) a partir das datas guardadas
 for(const t of list()){
  if((t.createdAt||0)<LOG_START)out.push({id:'h-'+t.id,type:'task_new',by:t.by,at:t.createdAt,name:t.name,owner:t.owner,xp:txp(t),hist:1});
  if((t.updatedAt||0)<LOG_START&&t.status!=='todo')out.push({id:'h2-'+t.id,type:'task_'+t.status,by:t.owner,at:t.updatedAt,name:t.name,owner:t.owner,xp:txp(t),hist:1});
 }
 for(const [id,r] of Object.entries(requests))if((r.createdAt||0)<LOG_START)out.push({id:'hr-'+id,type:'card_new',by:r.by,at:r.createdAt,name:r.name,xp:r.xp,hist:1});
 for(const [id,x] of Object.entries(suggestions))if((x.createdAt||0)<LOG_START)out.push({id:'hs-'+id,type:'sug_new',by:x.by,at:x.createdAt,text:x.text,hist:1});
 return out.filter(e=>e&&+e.at>0).sort((a,b)=>b.at-a.at);
}
const EV={
 task_new:e=>['📌','tarefas',`${NAME[e.by]||'Alguém'} mandou <b>${esc(e.name)}</b> para ${NAME[e.owner]||'?'}`],
 task_doing:e=>['▶','tarefas',`${NAME[e.owner]||'?'} começou <b>${esc(e.name)}</b>`],
 task_done:e=>['✓','tarefas',`${NAME[e.owner]||'?'} concluiu <b>${esc(e.name)}</b> <span style="color:var(--gold)">+${e.xp||0}XP</span>`],
 task_todo:e=>['✕','tarefas',`<b>${esc(e.name)}</b> voltou para não feita (${NAME[e.owner]||'?'})`],
 task_del:e=>['🗑','tarefas',`${NAME[e.by]||'Alguém'} removeu <b>${esc(e.name)}</b>`],
 card_new:e=>['🃏','cartas',`${NAME[e.by]||'Alguém'} criou a carta <b>${esc(e.name)}</b> (${e.xp}XP)`],
 card_icon:e=>['🎨','cartas',`O Claude desenhou o ícone de <b>${esc(e.name)}</b>`],
 sug_new:e=>['💡','ideias',`${NAME[e.by]||'Alguém'} sugeriu: <i>${esc(e.text||'')}</i>`],
 sug_approved:e=>['✅','ideias',`${esc(NAME.p1)} aprovou: <i>${esc(e.text||'')}</i>`],
 sug_rejected:e=>['⛔','ideias',`${esc(NAME.p1)} recusou: <i>${esc(e.text||'')}</i>`],
 sug_pending:e=>['↺','ideias',`${esc(NAME.p1)} desfez a aprovação: <i>${esc(e.text||'')}</i>`],
 sug_done:e=>['🚀','ideias',`Entrou no app: <i>${esc(e.text||'')}</i>`],
 reset:e=>['🔄','tarefas',`${NAME[e.by]||'Alguém'} zerou o placar (${e.n||0} tarefas)`],
 restore:e=>['⬆','tarefas',`${NAME[e.by]||'Alguém'} restaurou um backup (${e.n||0} tarefas)`]
};
let logFilter='todos';
function drawLog(){
 const box=$('logList');if(!box)return;
 const evs=allEvents().map(e=>({e,f:(EV[e.type]||(()=>['•','outros',esc(e.type)]))(e)})).filter(x=>logFilter==='todos'||x.f[1]===logFilter).slice(0,400);
 let day='',html='';
 for(const {e,f} of evs){
  const d=new Date(e.at),dk=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
  if(dk!==day){day=dk;html+=`<div class="lday">${dk.toUpperCase()}</div>`}
  const who=e.type.startsWith('task_')&&e.type!=='task_new'&&e.type!=='task_del'?e.owner:e.by;
  html+=`<div class="lrow"><span class="lt">${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>${FACE[who]?`<img src="${FACE[who]}" alt="">`:'<span class="lic">🤖</span>'}<span class="lic">${f[0]}</span><span class="lx">${f[2]}${e.hist?' <small title="reconstruído das datas da tarefa">·</small>':''}</span></div>`;
 }
 box.innerHTML=html||'<p class="empty">Nada registrado ainda.</p>';
}

/* ================= SINCRONIZAÇÃO ================= */
function onTasks(snap){
 const next={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.owner&&(x.owner==='p1'||x.owner==='p2'))next[d.id]={...x,id:d.id}});
 if(!firstSnap){
  snap.docChanges().forEach(ch=>{
   if(ch.doc.metadata.hasPendingWrites)return;
   const x=ch.doc.data();if(!x)return;
   const was=prevStatus[ch.doc.id];
   if(ch.type!=='removed'&&x.status==='done'&&was!=='done'&&was!==undefined){beep(SFX.partner);toast(x.owner,`${NAME[x.owner].toUpperCase()} COMPLETOU ${esc(x.name).toUpperCase()} +${txp(x)}XP`)}
   else if(ch.type==='added'&&was===undefined&&x.by&&x.by!==me){toast(x.owner,`NOVA MISSÃO PARA ${NAME[x.owner].toUpperCase()}: ${esc(x.name).toUpperCase()}`)}
  });
 }
 tasks=next;prevStatus={};for(const id in next)prevStatus[id]=next[id].status;
 if(!snap.metadata.fromCache){
  if(firstSnap&&snap.empty)offerMirror();
  else if(!snap.empty)saveMirror();
  firstSnap=false;clearTimeout(loadTimer);synced=true;updateStatus();}
 render();
}

}

   <div class="acts"><button class="btn" id="aG">SALVAR COM GOOGLE</button></div>
   <input id="aEm" type="email" placeholder="ou e-mail" style="width:100%;font-family:'VT323';font-size:20px;background:#000;color:#fff;border:2px solid var(--line);padding:8px;margin-top:6px">
   <input id="aPw" type="password" placeholder="senha (mín. 6)" style="width:100%;font-family:'VT323';font-size:20px;background:#000;color:#fff;border:2px solid var(--line);padding:8px;margin-top:6px">
   <div class="acts"><button class="btn ghost" id="aE">SALVAR COM E-MAIL</button></div></div>`:''}
  <p class="hint" style="margin-top:10px">Nomes e cores</p>
  <input id="sApp" maxlength="24" value="${esc(CONFIG.appName)}">
  <input id="sP1" maxlength="16" value="${esc(NAME.p1)}">${colorPick('sC1',PCOL.p1)}
  <input id="sP2" maxlength="16" value="${esc(NAME.p2)}">${colorPick('sC2',PCOL.p2)}
  <p class="hint" id="sMsg"></p>
  <div class="acts"><button class="btn" id="sSave">SALVAR</button><button class="btn ghost" id="sX">FECHAR</button></div>
  <div class="acts"><button class="chip" id="sOut">sair da conta</button></div>`);
 wirePick('sC1');wirePick('sC2');
 if(!joined){$('sCopy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteLink());$('sMsg').textContent='Link copiado! Mande para '+NAME.p2+'.'}catch(e){$('sLink').select();$('sMsg').textContent='Selecionado — copie pelo celular.'}};
  const sh=$('sShare');if(sh)sh.onclick=()=>navigator.share({title:CONFIG.appName,text:'Bora dividir as tarefas da casa? Entra aqui:',url:inviteLink()}).catch(()=>{});}
 $('sX').onclick=closeModal;$('sOut').onclick=()=>{if(FB.isAnon&&FB.isAnon()&&!confirmAnonOut())return;closeModal();FB.signOut()};
 const ag=$('aG');if(ag){
  const done=()=>{closeModal();banner('CONTA SALVA!','AGORA DÁ PRA TROCAR DE APARELHO');updateStatus()};
  ag.onclick=async()=>{$('sMsg').textContent='Abrindo…';try{await FB.linkGoogle();done()}catch(e){$('sMsg').textContent=authMsg(e)}};
  $('aE').onclick=async()=>{const em=$('aEm').value.trim(),pw=$('aPw').value;if(!em||!pw){$('sMsg').textContent='Preencha e-mail e senha.';return}
   try{await FB.linkPassword(em,pw);done()}catch(e){$('sMsg').textContent=authMsg(e)}};
 }
 $('sSave').onclick=async()=>{
  const patch={appName:$('sApp').value.trim()||'Casa Co-op','p1.name':$('sP1').value.trim()||NAME.p1,'p1.color':$('sC1').dataset.v,'p2.name':$('sP2').value.trim()||NAME.p2,'p2.color':$('sC2').dataset.v};
  try{await FB.updateHouse(houseId,patch);closeModal()}catch(e){$('sMsg').textContent='Não salvou ('+(e&&e.code||'erro')+').'}
 };
}
function onHouse(h){
 house=h;
 CONFIG={appName:h.appName||'Casa Co-op',p1:{name:h.p1&&h.p1.name,color:h.p1&&h.p1.color,face:''},p2:{name:h.p2&&h.p2.name,color:h.p2&&h.p2.color,face:''}};
 setPlayers();applyConfig();
 const uid=FB.user.uid;me=h.p1&&h.p1.uid===uid?'p1':h.p2&&h.p2.uid===uid?'p2':null;
 iAmOwner=h.owner===uid;renderMe();render();
 if(FB.trackInfo)FB.trackInfo({houseId,houseName:h.appName||'',player:me?NAME[me]:''});
 updateStatus();
}
function enterHouse(){
 ungate();unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];firstSnap=true;synced=false;tasks={};prevStatus={};
 db=FB.houseDB(houseId);
 $('statusLine').textContent='Conectando…';
 loadTimer=setTimeout(()=>{$('statusLine').textContent='Ainda conectando… confira a internet.'},10000);
 unsubs.push(FB.watchHouse(houseId,h=>{if(!h){gate('<p class="hint">Você não faz mais parte desta casa.</p>');return}onHouse(h)},e=>fail(e)));
 unsubs.push(db.collection('tasks').onSnapshot(onTasks,e=>{clearTimeout(loadTimer);fail(e)}));
 unsubs.push(db.collection('cards').onSnapshot(sn=>{const n={};sn.docs.forEach(d=>{n[d.id]=d.data()});extraCards=n;render()},()=>{}));
 unsubs.push(db.collection('suggestions').onSnapshot(sn=>{const n={};sn.docs.forEach(d=>{n[d.id]=d.data()});suggestions=n;if(view==='ideias')render()},()=>{}));
 unsubs.push(db.collection('approvals').onSnapshot(sn=>{const n={};sn.docs.forEach(d=>{n[d.id]=d.data()});approvals=n;if(view==='ideias')render()},()=>{}));
 unsubs.push(db.collection('events').orderBy('at','desc').limit(500).onSnapshot(sn=>{const n={};sn.docs.forEach(d=>{n[d.id]=d.data()});events=n;if(!$('modal').hidden&&$('logList'))drawLog()},()=>{}));
 $('modeNote').textContent='Placar compartilhado';
}
async function start(){
 applyConfig();render();
 gate('<p class="hint">Carregando…</p>');
 FB=await window.FBReady;
 if(FB.isEmailLink&&FB.isEmailLink()){const em=FB.savedEmail();if(em){try{await FB.finishEmailLink(em)}catch(e){showFinishLink()}}else showFinishLink()}
 FB.onAuth(async u=>{
  unsubs.forEach(x=>{try{x()}catch(e){}});unsubs=[];
  if(!u){houseId=null;house=null;me=null;showSignIn();return}
  if(FB.trackStart)FB.trackStart();
  gate('<p class="hint">Abrindo a sua casa…</p>');
  try{houseId=await FB.myHouse()}catch(e){houseId=null}
  const inv=parseInvite();
  if(houseId&&(!inv||inv.h===houseId)){if(inv)clearInvite();enterHouse()}else showCreate();
 });
}
start();
</script>
</body>
</html>
